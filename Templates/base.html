<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{{ title or "LibyaBnB" }}</title>

  <!-- Global styles only -->
  <link rel="stylesheet" href="/static/styles.css">

  <!-- Page-specific styles -->
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="/">LibyaBnB</a>
        <nav class="nav">
          <a href="/my-booking" class="nav-link">My booking</a>
          <a href="/supervisors" class="nav-link">Supervisors</a>
          
          {% if user %}
            <a href="/myprofile" class="nav-link">My Profile</a>
            <a href="/logout" class="nav-link">Sign out</a>
          {% else %}
            <a href="/login" class="nav-link">Login</a>
            <a href="/signup" class="nav-link">Sign up</a>
          {% endif %}
          
          <a href="/admin" class="nav-link">Admin</a>
          <a href="/site_admin" class="nav-link">Site admin</a>
        </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <!-- Page-specific scripts -->
  {% block scripts %}{% endblock %}
</body>
</html>
